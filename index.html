<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fortune Cookie</title>
<meta property="og:title" content="A fortune for you">
<meta property="og:image" content="/poster.jpg">
<style>
  /* Layout: the clip fills the whole screen; the link sits exactly on the paper slip */
  :root {
    --ground: #f4f4f4;   /* matches the video's neutral backdrop */
    --focus: rgba(43, 63, 154, .14);
    color-scheme: light;
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ground); overflow: hidden; }
  .stage {
    position: fixed; inset: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
  .stage.is-open { cursor: default; }
  .stage video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: 50% 50%;
    display: block;
  }
  /* Desktop / landscape: a proportioned 9:16 column, centred, edges faded into the page */
  @media (min-aspect-ratio: 3/4) {
    .stage {
      inset: 6vh auto;
      left: 50%;
      transform: translateX(-50%);
      height: 88vh;
      width: calc(88vh * 9 / 16);
    }
    .stage video {
      -webkit-mask-image:
        linear-gradient(to right, transparent 0, #000 16%, #000 84%, transparent 100%),
        linear-gradient(to bottom, transparent 0, #000 10%, #000 90%, transparent 100%);
      -webkit-mask-composite: source-in;
              mask-image:
        linear-gradient(to right, transparent 0, #000 16%, #000 84%, transparent 100%),
        linear-gradient(to bottom, transparent 0, #000 10%, #000 90%, transparent 100%);
              mask-composite: intersect;
    }
  }
  .slip {
    position: absolute; inset: 0;
    cursor: pointer;
  }
  .slip:focus-visible { background: var(--focus); }
</style>
</head>
<body>
<main class="stage" id="stage" tabindex="0" aria-label="Fortune cookie — tap to open">
  <video id="cookie" src="cookie.mp4" poster="poster.jpg" playsinline muted preload="auto"></video>
  <a class="slip" id="slip" href="https://andreacelante.vercel.app/" aria-label="Open Andrea Celante's portfolio" hidden></a>
</main>

<script>
  const stage = document.getElementById('stage');
  const video = document.getElementById('cookie');
  const slip  = document.getElementById('slip');

  // Paper slip in the final frame, as fractions of the video (TL, TR, BR, BL)
  const SLIP = [[.257,.427],[.732,.450],[.687,.541],[.309,.521]];
  const VW = 720, VH = 1280, POS_X = .5, POS_Y = .5;

  function placeSlip() {
    const W = stage.clientWidth, H = stage.clientHeight;
    const s = Math.max(W / VW, H / VH);           // object-fit: cover
    const ox = (W - VW * s) * POS_X, oy = (H - VH * s) * POS_Y;
    const pts = SLIP.map(([x, y]) => `${(ox + x * VW * s).toFixed(1)}px ${(oy + y * VH * s).toFixed(1)}px`);
    slip.style.clipPath = `polygon(${pts.join(',')})`;
  }
  placeSlip();
  addEventListener('resize', placeSlip);

  let state = 'closed';
  function open() {
    if (state !== 'closed') return;
    state = 'opening';
    video.currentTime = 0;
    const p = video.play();
    if (p && p.catch) p.catch(() => { state = 'closed'; });
  }
  stage.addEventListener('click', open);
  stage.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
  });
  video.addEventListener('ended', () => {
    state = 'open';
    stage.classList.add('is-open');
    slip.hidden = false;
  });
</script>
</body>
</html>
