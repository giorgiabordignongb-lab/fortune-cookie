<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fortune Cookie</title>
<meta property="og:title" content="A fortune for you">
<meta property="og:image" content="/poster.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital@0;1&display=swap">
<style>
  /* Layout: one 9:16 stage centred on a paper-white ground that matches the video's backdrop */
  :root {
    --ground: #f0f2ef;      /* sampled from the video's backdrop */
    --ink: #2b3f9a;         /* fortune-slip print blue */
    --ink-soft: rgba(43, 63, 154, .55);
    --font-hint: "Libre Caslon Text", "Times New Roman", Times, serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    background: var(--ground);
    color: var(--ink);
    margin: 0;
    overflow: hidden;
    display: grid;
    place-items: center;
    padding-inline: 0;
  }
  .stage {
    position: relative;
    height: 100%;
    max-height: 100%;
    aspect-ratio: 9 / 16;
    max-width: 100%;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .stage video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  /* on wide screens, fade the side edges so the clip melts into the page */
  @media (min-aspect-ratio: 10/16) {
    .stage video {
      -webkit-mask-image: linear-gradient(to right, transparent 0, #000 10%, #000 90%, transparent 100%);
              mask-image: linear-gradient(to right, transparent 0, #000 10%, #000 90%, transparent 100%);
    }
  }
  .hint {
    position: absolute; left: 0; right: 0; bottom: 14%;
    text-align: center;
    font-family: var(--font-hint);
    font-style: italic;
    font-size: clamp(15px, 2.2vh, 20px);
    letter-spacing: .02em;
    color: var(--ink-soft);
    pointer-events: none;
    transition: opacity .5s ease;
    animation: breathe 2.4s ease-in-out infinite;
  }
  .hint.gone { opacity: 0; animation: none; }
  @keyframes breathe { 0%,100% { opacity: .55 } 50% { opacity: 1 } }

  /* clickable fortune slip — shaped to the paper in the final frame */
  .slip {
    position: absolute; inset: 0;
    clip-path: polygon(25.7% 42.7%, 73.2% 45%, 68.7% 54.1%, 30.9% 52.1%);
    cursor: pointer;
  }
  .slip:focus-visible { outline: none; background: rgba(43, 63, 154, .12); }
  @media (prefers-reduced-motion: reduce) { .hint { animation: none; } }
</style>

</head>
<body>
<main class="stage" id="stage" aria-label="Fortune cookie">
  <video id="cookie" src="cookie.mp4" poster="poster.jpg" playsinline muted preload="auto"></video>
  <p class="hint" id="hint">tap to crack it open</p>
  <a class="slip" id="slip" href="https://andreacelante.vercel.app/" aria-label="Open Andrea Celante's portfolio" hidden></a>
</main>

<script>
  const stage = document.getElementById('stage');
  const video = document.getElementById('cookie');
  const hint  = document.getElementById('hint');
  const slip  = document.getElementById('slip');
  let state = 'closed'; // closed → opening → open

  stage.addEventListener('click', (e) => {
    if (state !== 'closed') return;
    state = 'opening';
    hint.classList.add('gone');
    video.currentTime = 0;
    const p = video.play();
    if (p && p.catch) p.catch(() => { state = 'closed'; hint.classList.remove('gone'); });
  });

  video.addEventListener('ended', () => {
    state = 'open';
    stage.style.cursor = 'default';
    slip.hidden = false;
  });

  stage.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && state === 'closed') { e.preventDefault(); stage.click(); }
  });
  stage.tabIndex = 0;
</script>

</body>
</html>
